<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育施設マップ</title>

  <!-- Leaflet（地図表示ライブラリ） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      color: #222;
      background: #f5f6f8;
    }
    header {
      padding: 14px 20px;
      background: #243b53;
      color: white;
    }
    header h1 {
      margin: 0 0 5px;
      font-size: 21px;
    }
    header p {
      margin: 0;
      font-size: 13px;
      opacity: .9;
    }
    #status {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }
    #map {
      width: 100%;
      height: calc(100vh - 112px);
      min-height: 420px;
    }
    .error { color: #b42318; font-weight: bold; }
    .legend {
      background: white;
      padding: 9px 12px;
      line-height: 1.6;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
      font-size: 12px;
    }
    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .popup-title { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
    .popup-table { border-collapse: collapse; font-size: 12px; }
    .popup-table th, .popup-table td {
      padding: 3px 5px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }
    .popup-table th { white-space: nowrap; color: #555; }
    @media (max-width: 600px) {
      header h1 { font-size: 18px; }
      #map { height: calc(100vh - 105px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>教育施設マップ</h1>
    <p>GeoJSONファイルに登録された施設の位置を地図上に表示します。</p>
  </header>

  <div id="status">GeoJSONデータを読み込んでいます...</div>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // HTMLファイルと同じフォルダに置いたGeoJSONファイルを読み込む
    const GEOJSON_FILE = "./P29-23_13.geojson";

    // 地図を初期化
    const map = L.map("map");

    // OpenStreetMapの地図タイルを使用
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 学校分類コードと表示名
    const schoolTypes = {
      "16001": "小学校",
      "16002": "中学校",
      "16003": "中等教育学校",
      "16004": "高等学校",
      "16005": "高等専門学校",
      "16006": "短期大学",
      "16007": "大学",
      "16011": "幼稚園",
      "16012": "特別支援学校",
      "16013": "幼保連携型認定こども園",
      "16014": "義務教育学校",
      "16015": "各種学校",
      "16016": "専修学校"
    };

    const typeColors = {
      "16001": "#e74c3c",
      "16002": "#3498db",
      "16003": "#8e44ad",
      "16004": "#f39c12",
      "16005": "#16a085",
      "16006": "#d35400",
      "16007": "#2c3e50",
      "16011": "#e84393",
      "16012": "#7f8c8d",
      "16013": "#27ae60",
      "16014": "#6c5ce7",
      "16015": "#00a8cc",
      "16016": "#795548"
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getProperty(properties, key) {
      const value = properties?.[key];
      return value === null || value === undefined || value === "" ? "情報なし" : value;
    }

    function createPopup(properties) {
      const name = getProperty(properties, "P29_004");
      const typeCode = String(getProperty(properties, "P29_003"));
      const typeName = schoolTypes[typeCode] || `分類コード：${typeCode}`;

      return `
        <div class="popup-title">${escapeHtml(name)}</div>
        <table class="popup-table">
          <tr><th>学校の種類</th><td>${escapeHtml(typeName)}</td></tr>
          <tr><th>所在地</th><td>${escapeHtml(getProperty(properties, "P29_005"))}</td></tr>
          <tr><th>学校コード</th><td>${escapeHtml(getProperty(properties, "P29_002"))}</td></tr>
          <tr><th>管理者コード</th><td>${escapeHtml(getProperty(properties, "P29_006"))}</td></tr>
          <tr><th>休校区分</th><td>${escapeHtml(getProperty(properties, "P29_007"))}</td></tr>
          <tr><th>キャンパスコード</th><td>${escapeHtml(getProperty(properties, "P29_008"))}</td></tr>
          <tr><th>備考</th><td>${escapeHtml(getProperty(properties, "P29_009"))}</td></tr>
        </table>
      `;
    }

    // GeoJSONを読み込み、施設を地図上に描画
    fetch(GEOJSON_FILE)
      .then(response => {
        if (!response.ok) {
          throw new Error(`ファイルを読み込めませんでした（HTTP ${response.status}）。`);
        }
        return response.json();
      })
      .then(geojson => {
        if (!geojson.features || !Array.isArray(geojson.features)) {
          throw new Error("GeoJSONの形式がFeatureCollectionではありません。");
        }

        const markers = L.geoJSON(geojson, {
          pointToLayer: (feature, latlng) => {
            const code = String(feature.properties?.P29_003 ?? "");
            const color = typeColors[code] || "#666666";

            return L.circleMarker(latlng, {
              radius: 5,
              color: "#ffffff",
              weight: 1,
              fillColor: color,
              fillOpacity: 0.85
            });
          },
          onEachFeature: (feature, layer) => {
            layer.bindPopup(createPopup(feature.properties || {}));
          }
        }).addTo(map);

        const count = geojson.features.length;
        if (markers.getLayers().length > 0) {
          map.fitBounds(markers.getBounds(), { padding: [25, 25] });
        } else {
          map.setView([35.6812, 139.7671], 11);
        }

        document.getElementById("status").textContent =
          `読み込み完了：${count.toLocaleString()}件の施設を表示しています。マーカーをクリックすると施設情報を確認できます。`;

        // 学校分類の凡例
        const legend = L.control({ position: "bottomright" });
        legend.onAdd = function () {
          const div = L.DomUtil.create("div", "legend");
          div.innerHTML = "<strong>学校の種類</strong><br>";
          Object.entries(schoolTypes).forEach(([code, name]) => {
            div.innerHTML +=
              `<div><i style="background:${typeColors[code]}"></i>${escapeHtml(name)}</div>`;
          });
          div.innerHTML += '<div><i style="background:#666666"></i>その他</div>';
          return div;
        };
        legend.addTo(map);
      })
      .catch(error => {
        console.error("GeoJSON読み込みエラー:", error);
        const status = document.getElementById("status");
        status.className = "error";
        status.textContent =
          "GeoJSONを読み込めませんでした。" + error.message +
          " HTMLファイルとGeoJSONファイルが同じフォルダにあることを確認し、ローカルサーバー経由で開いてください。";
      });
  </script>
</body>
</html>
